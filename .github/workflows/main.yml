name: Waffle Granular Pipeline

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

jobs:
  prepare:
    name: ⚙️ Prepare Matrix
    # One canonical workflow for every component (wfl ci:check compares them
    # byte for byte). The template repo itself carries placeholder names and
    # cannot install, so it skips here; every downstream job needs this one.
    if: github.repository != 'waffle-commons/component-template'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          echo 'matrix={"operating-system":["ubuntu-24.04"],"php-version":["8.5"]}' >> "$GITHUB_OUTPUT"

  build:
    name: 🏗️ Build & Install
    needs: prepare
    runs-on: ${{ matrix.operating-system }}
    outputs:
      matrix: ${{ needs.prepare.outputs.matrix }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-composer-

      - name: Install dependencies with Composer
        run: composer install --no-progress --prefer-dist --optimize-autoloader

  mago_fmt:
    name: 💅 Formatter (Mago Fmt)
    needs: build
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist
      - name: Check formatting with Mago Fmt
        run: vendor/bin/mago fmt --check

  mago_lint:
    name: 🎨 Linter (Mago Lint)
    needs: build
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
      - name: Cache and Install
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
      - run: composer install --no-progress --prefer-dist
      - name: Run Mago Lint
        run: vendor/bin/mago lint --reporting-format=github

  mago_analyze:
    name: 🔬 Static Analysis (Mago Analyze)
    needs: build
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
      - run: composer install --no-progress --prefer-dist
      - name: Run Mago Analyze
        run: vendor/bin/mago analyze --reporting-format=github

  mago_guard:
    name: 🛡️ Guardian Analysis (Mago Guard)
    needs: build
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
      - run: composer install --no-progress --prefer-dist
      - name: Run Mago Guard
        run: vendor/bin/mago guard --reporting-format=github

  igor_php:
    name: 🧟️ Memory Analysis (Igor PHP)
    needs: build
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
      - run: composer install --no-progress --prefer-dist
      # The composer package is only a bootstrapper: bin/igor-php resolves
      # releases/latest from the GitHub API and downloads THAT binary, so the
      # composer constraint and composer.lock pin nothing. Drop any binary a
      # cache or an earlier run left behind, seed the version file it reads,
      # then assert against the BINARY's own banner: `--version` prints to
      # stderr, and the bootstrapper's download message also contains the
      # version, so only an exact-line match on the merged stream proves it.
      - name: Pin the Igor auditor
        env:
          IGOR_VERSION: '0.9.7'
        run: |
          bin_dir=vendor/igor-php/igor-php/resources/bin
          rm -rf "$bin_dir" && mkdir -p "$bin_dir"
          printf '%s' "$IGOR_VERSION" > "$bin_dir/.version"
          vendor/bin/igor-php --version 2>&1 | tee /dev/stderr | grep -qFx "igor-php version $IGOR_VERSION"

      - name: Run Igor PHP
        run: vendor/bin/igor-php .

  secret_scan:
    name: 🕵️ Secret Scanning (TruffleHog)
    needs: build
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.97.9
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: ${{ github.head_ref }}
          extra_args: --debug --only-verified

  sbom_generate:
    name: 📦 SBOM (CycloneDX)
    needs: build
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
      - name: Generate SBOM
        run: composer install && composer CycloneDX:make-sbom --output-format=json --output-file=bom.json
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: bom.json

  security_scan:
    name: 🛡️ Code Security (SCA & SAST)
    needs: build
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
      - run: composer install --no-progress --prefer-dist
      - name: Audit Composer dependencies (SCA)
        run: composer audit
      - name: Run Taint Analysis (SAST)
        run: vendor/bin/psalm --taint-analysis

  unit_tests:
    name: 🧪 Tests (PHP ${{ matrix.php-version }})
    needs: [build, mago_lint, mago_analyze, secret_scan, sbom_generate, security_scan]
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    if: (failure() || success()) && github.repository != 'waffle-commons/component-template'
    # The data and queue suites talk to a real Redis (WAFFLE_TEST_REDIS_HOST); without one they skip.
    services:
      waffle-redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gd, pgsql, pdo_mysql, pdo_pgsql, gmp, fileinfo, intl, opcache, xml, iconv, redis, mailparse
          coverage: xdebug
          tools: composer:v2
      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
      - run: composer install --no-progress --prefer-dist
      # A fresh scaffold has no source: nothing to test or measure yet. The
      # first PHP file under src/ switches the full test + coverage gate on.
      - name: Scaffold without source
        if: hashFiles('src/**/*.php') == ''
        run: echo "::notice::no PHP source under src/ yet — tests and coverage start with the first class"
      - name: Run PHPUnit tests
        if: hashFiles('src/**/*.php') != ''
        env:
          WAFFLE_TEST_REDIS_HOST: 127.0.0.1
        run: vendor/bin/phpunit --coverage-clover ./var/data/phpunit-coverage/clover.xml
      - name: Upload coverage to Codecov
        if: hashFiles('src/**/*.php') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./var/data/phpunit-coverage/clover.xml
