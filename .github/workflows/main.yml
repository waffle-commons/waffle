name: Waffle Granular Pipeline

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

jobs:
  prepare:
    name: ⚙️ Prepare Matrix
    # One canonical workflow for every component (wfl ci:check compares them
    # byte for byte). The template repo itself carries placeholder names and
    # cannot install, so it skips here; every downstream job needs this one.
    if: github.repository != 'waffle-commons/component-template'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          echo 'matrix={"operating-system":["ubuntu-24.04"],"php-version":["8.5"]}' >> "$GITHUB_OUTPUT"

  build:
    name: 🏗️ Build & Install
    needs: prepare
    runs-on: ${{ matrix.operating-system }}
    outputs:
      matrix: ${{ needs.prepare.outputs.matrix }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2

      # composer.json requires php ^8.5.12: stop here, before anything installs, when
      # setup-php resolves an older 8.5 release.
      - name: Assert the PHP floor
        run: |
          php -r 'exit(PHP_VERSION_ID >= 80512 ? 0 : 1);' \
            || { echo "::error::PHP 8.5.12 or later is required; setup-php gave $(php -r 'echo PHP_VERSION;')"; exit 1; }

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-composer-

      - name: Install dependencies with Composer
        run: composer install --no-progress --prefer-dist --optimize-autoloader

  mago_fmt:
    name: 💅 Formatter (Mago Fmt)
    needs: build
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist
      - name: Check formatting with Mago Fmt
        run: vendor/bin/mago fmt --check

  mago_lint:
    name: 🎨 Linter (Mago Lint)
    needs: build
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
      - name: Cache and Install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
      - run: composer install --no-progress --prefer-dist
      - name: Run Mago Lint
        run: vendor/bin/mago lint --reporting-format=github

  mago_analyze:
    name: 🔬 Static Analysis (Mago Analyze)
    needs: build
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
      - run: composer install --no-progress --prefer-dist
      - name: Run Mago Analyze
        run: vendor/bin/mago analyze --reporting-format=github

  mago_guard:
    name: 🛡️ Guardian Analysis (Mago Guard)
    needs: build
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
      - run: composer install --no-progress --prefer-dist
      - name: Run Mago Guard
        run: vendor/bin/mago guard --reporting-format=github

  igor_php:
    name: 🧟️ Memory Analysis (Igor PHP)
    needs: build
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    # The auditor pin, for every step of the job: the bootstrapper takes its version from
    # IGOR_VERSION, else from composer.lock. Keep it equal to .igor-version, and the hash equal
    # to the release's linux_amd64 archive (wfl ci:check enforces both).
    env:
      IGOR_VERSION: '0.11.0'
      IGOR_SHA256_LINUX_AMD64: 'c799c02830eeb3e91cb9fcfeb6a2ec8da34ebcade27d6d55496f93253cc866c5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
      - run: composer install --no-progress --prefer-dist
      # The composer package is only a bootstrapper: vendor/bin/igor-php runs the binary in
      # resources/bin/<x-y-z>_<os>_<arch>/ and, when that is missing, downloads it unverified.
      # So drop whatever a cache or an earlier run left there, fetch the release archive,
      # check it against the committed SHA-256, and extract it where the bootstrapper looks.
      # Then assert the binary's own banner: `--version` prints to stderr, so only an
      # exact-line match on the merged stream proves the version.
      - name: Pin and verify the Igor auditor
        run: |
          [ "$RUNNER_OS" = Linux ] && [ "$RUNNER_ARCH" = X64 ] || { echo "::error::the pinned igor hash covers linux_amd64 only"; exit 1; }
          bin_dir=vendor/igor-php/igor-php/resources/bin
          dest="$bin_dir/$(printf '%s' "$IGOR_VERSION" | tr . -)_linux_amd64"
          archive="$RUNNER_TEMP/igor-php.tar.gz"
          rm -rf "$bin_dir" && mkdir -p "$dest"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/igor-php/igor-php/releases/download/v${IGOR_VERSION}/igor-php_${IGOR_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$IGOR_SHA256_LINUX_AMD64" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$dest" igor-php
          vendor/bin/igor-php --version 2>&1 | tee /dev/stderr | grep -qFx "igor-php version $IGOR_VERSION"

      - name: Run Igor PHP
        run: vendor/bin/igor-php .

  secret_scan:
    name: 🕵️ Secret Scanning (TruffleHog)
    needs: build
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The action runs the image ghcr.io/trufflesecurity/trufflehog:<version>; the digest pins the
      # scanner itself, not only the action that starts it.
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@d232362a64a09a9e7d58267b8f5acef00ae90e23 # v3.100.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: ${{ github.head_ref }}
          extra_args: --debug --only-verified
          version: 3.100.0@sha256:8fd07ea46a3f59583c4d50f006d8cf150530141b28969c3c34cc455cb9165a6b

  sbom_generate:
    name: 📦 SBOM (CycloneDX)
    needs: build
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
      - name: Generate SBOM
        run: composer install && composer CycloneDX:make-sbom --output-format=json --output-file=bom.json
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: bom.json

  security_scan:
    name: 🛡️ Code Security (SCA & SAST)
    needs: build
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
      - run: composer install --no-progress --prefer-dist
      - name: Audit Composer dependencies (SCA)
        run: composer audit
      - name: Run Taint Analysis (SAST)
        run: vendor/bin/psalm --taint-analysis

  unit_tests:
    name: 🧪 Tests (PHP ${{ matrix.php-version }})
    needs: [build, mago_lint, mago_analyze, secret_scan, sbom_generate, security_scan]
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    if: (failure() || success()) && github.repository != 'waffle-commons/component-template'
    # The data and queue suites talk to a real Redis (WAFFLE_TEST_REDIS_HOST); without one they skip.
    services:
      waffle-redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gd, pgsql, pdo_mysql, pdo_pgsql, gmp, fileinfo, intl, opcache, xml, iconv, redis, mailparse
          coverage: xdebug
          tools: composer:v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
      - run: composer install --no-progress --prefer-dist
      # A fresh scaffold has no source: nothing to test or measure yet. The
      # first PHP file under src/ switches the full test + coverage gate on.
      - name: Scaffold without source
        if: hashFiles('src/**/*.php') == ''
        run: echo "::notice::no PHP source under src/ yet — tests and coverage start with the first class"
      - name: Run PHPUnit tests
        if: hashFiles('src/**/*.php') != ''
        env:
          WAFFLE_TEST_REDIS_HOST: 127.0.0.1
        run: vendor/bin/phpunit --coverage-clover ./var/data/phpunit-coverage/clover.xml
      - name: Upload coverage to Codecov
        if: hashFiles('src/**/*.php') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./var/data/phpunit-coverage/clover.xml
